runtime: go127
service: default
app_engine_apis: true

# Cap scale-out so a crawler surge can't run up instance hours.
automatic_scaling:
  max_instances: 3

env_variables:
  FIRESTORE_PROJECT_ID: "esperanto-kurso"
  WEBAUTHN_RPID: "esperanto-kurso.net"
  WEBAUTHN_ORIGIN: "https://esperanto-kurso.net"

handlers:
  - url: /robots.txt
    static_files: static/robots.txt
    upload: static/robots.txt
  # The course as a game (game/), built into static/ludo by `make ludo`
  # before deploying; App Engine serves it as static files.
  - url: /ludo/
    static_files: static/ludo/index.html
    upload: static/ludo/index\.html
  - url: /ludo/(.*\.wasm)
    static_files: static/ludo/\1
    upload: static/ludo/.*\.wasm
    mime_type: application/wasm
  - url: /ludo/(.+)
    static_files: static/ludo/\1
    upload: static/ludo/.+
  - url: /static
    static_dir: static
  - url: /admin/initial
    script: auto
    login: admin
  - url: /.*
    script: auto
